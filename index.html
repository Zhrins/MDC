<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Data MDC DKP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Patrick Hand', cursive;
            background-color: #fdfaf6;
            background-image: repeating-linear-gradient(transparent, transparent 31px, #60a5fa 31px, #60a5fa 32px);
            background-attachment: local;
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; text-align: center;
        }
        .doodle-card {
            background-color: #ffffff; border: 4px solid #1f2937; border-radius: 2% 95% 3% 95% / 95% 4% 92% 5%;
            box-shadow: 10px 10px 0px #1f2937; transform: rotate(-1deg); width: 100%; max-width: 500px;
        }
        .doodle-input {
            border: 3px solid #1f2937; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            background-color: #f8fafc; width: 85%; margin: 0 auto 1rem auto; display: block; padding: 0.75rem; text-align: center;
        }
        .doodle-btn {
            border: 3px solid #1f2937; border-radius: 15px 225px 15px 255px/255px 15px 225px 15px;
            box-shadow: 5px 5px 0px #1f2937; margin: 0.5rem auto; display: block; padding: 1rem 2rem; font-weight: bold; cursor: pointer;
        }
        /* Style Progres Bar */
        .progress-bg { border: 3px solid #1f2937; border-radius: 20px; overflow: hidden; height: 30px; width: 85%; margin: 10px auto; display: none; }
        .progress-bar { height: 100%; background-color: #4ade80; width: 0%; transition: width 0.4s ease; }
    </style>
</head>
<body>

    <div class="doodle-card p-8">
        <h1 class="text-4xl font-bold mb-6 text-gray-800">Pusat Data MDC</h1>
        
        <form id="submissionForm">
            <input type="text" id="nama" placeholder="Nama Pengirim" class="doodle-input" required>
            <select id="seksi" class="doodle-input" required>
                <option value="" disabled selected>-- Pilih Seksi --</option>
                <option value="Bendahara">💰 Bendahara</option>
                <option value="Anggota">👥 Anggota</option>
                <option value="Logistik">📦 Logistik</option>
                <option value="Sekretaris">📝 Sekretaris</option>
                <option value="Media Kreatif">🎨 Media Kreatif</option>
            </select>
            <textarea id="keterangan" rows="2" placeholder="Keterangan..." class="doodle-input"></textarea>
            
            <div class="upload-zone border-3 border-dashed border-gray-400 w-4/5 mx-auto p-4 rounded-xl">
                <label for="fileInput" class="doodle-btn bg-blue-300 w-full">📁 Pilih Banyak File</label>
                <input type="file" id="fileInput" multiple required class="hidden">
                <div id="fileList" class="text-sm mt-2 text-gray-600"></div>
            </div>

            <button type="submit" id="submitBtn" class="doodle-btn bg-yellow-400 w-3/4 text-2xl mt-6">🚀 KIRIM BERKAS</button>
        </form>

        <div id="progressContainer" class="progress-bg"><div id="progressBar" class="progress-bar"></div></div>
        <div id="statusText" class="font-bold text-lg mt-2"></div>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Di GitHub kodenya cuma begini. PURE tanpa API Key.
        // Vercel bakal ganti teks ini otomatis pas lagi proses deploy.
        const SUPABASE_URL = 'VERCEL_REPLACE_URL';
        const SUPABASE_ANON_KEY = 'VERCEL_REPLACE_KEY';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const statusText = document.getElementById('statusText');

        fileInput.onchange = () => fileList.innerText = fileInput.files.length + " file dipilih.";

        document.getElementById('submissionForm').onsubmit = async (e) => {
            e.preventDefault();
            const files = fileInput.files;
            progressContainer.style.display = "block";
            
            for(let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileName = `mdc_${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
                
                // Upload
                await supabaseClient.storage.from('berkas_pramuka').upload(fileName, file);
                await supabaseClient.from('pengumpulan_data').insert([{
                    nama: document.getElementById('nama').value,
                    seksi: document.getElementById('seksi').value,
                    keterangan: document.getElementById('keterangan').value,
                    file_url: fileName
                }]);

                // Update Progres Bar
                let percent = Math.round(((i + 1) / files.length) * 100);
                progressBar.style.width = percent + "%";
                statusText.innerText = `Mengirim: ${percent}% (${i+1}/${files.length})`;
            }
            statusText.innerText = "Selesai! Semua data terkirim.";
            setTimeout(() => { document.getElementById('submissionForm').reset(); progressContainer.style.display="none"; }, 2000);
        };
    </script>
</body>
</html>
